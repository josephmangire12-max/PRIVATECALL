<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SwiftChat</title>
<style>
:root{--bg:#f2f6ff;--sf:#fff;--tx:#0b1f4d;--mu:#5a6b94;--pr:#1553e6;--pr2:#0b3aa8;--ln:#d9e3fb;--me:#1553e6;--mt:#fff;--th:#e6eeff;--bg2:#ece5dd;--bubme:#d9f7c4;--bubmt:#0b1f4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a1330;--sf:#111e45;--tx:#e8eeff;--mu:#97a8d6;--ln:#22336b;--th:#1a2a5c;--pr:#4a82ff;--bg2:#0d1a3d;--bubme:#1d5e3c;--bubmt:#e8eeff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a1330;--sf:#111e45;--tx:#e8eeff;--mu:#97a8d6;--ln:#22336b;--th:#1a2a5c;--pr:#4a82ff;--bg2:#0d1a3d;--bubme:#1d5e3c;--bubmt:#e8eeff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",system-ui,Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
header{background:var(--pr2);color:#fff;padding:12px 16px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
main{flex:1;overflow-y:auto;padding:12px}
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 0;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button.on{color:var(--pr);font-weight:700}nav svg{width:22px;height:22px}
button{font:inherit;cursor:pointer}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600}
.btn.o{background:var(--th);color:var(--pr)}
.seg{display:flex;background:var(--th);border-radius:10px;padding3px;margin-bottom:10px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:7px;border-radius:8px}
.seg button.on{background:var(--sf);color:var(--pr);font-weight:700}
.row{display:flex;align-items:center;gap:10px;background:var(--sf);border-radius:12px;padding:10px;margin-bottom:8px;border:1px solid var(--ln)}
.row .t{flex:1;min-width:0}.row .s{color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:42px;height:42px;border-radius:50%;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;overflow:hidden}
.av img,.av video{width:100%;height:100%;object-fit:cover}
.ib{border:0;background:var(--th);color:var(--pr);width:36px;height:36px;border-radius:50%;font-size:16px}
input[type=text]{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);font:inherit}
.ov{position:absolute;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ov .msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 11px;border-radius:14px;background:var(--sf);border:1px solid var(--ln);align-self:flex-start;word-break:break-word}
.m.me{align-self:flex-end;background:var(--me);color:var(--mt);border-color:var(--me)}
.m img,.m video{max-width:100%;border-radius:8px;display:block}
.bar{display:flex;gap:6px;padding:8px;background:var(--sf);border-top:1px solid var(--ln);align-items:center}
.menu{display:flex;gap:6px;padding:8px;background:var(--th);flex-wrap:wrap}
.call{background:#06143a;color:#fff;z-index:9;align-items:center;justify-content:center;gap:14px;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;flex:1;max-height:60%}
.tile{background:#13276b;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;font-weight:600}
.tile video{width:100%;height:100%;object-fit:cover}
.tile{position:relative}.tile small{position:absolute;bottom:6px;left:8px;background:#0008;padding:2px 6px;border-radius:6px}
.end{background:#e5484d;color:#fff;border:0;border-radius:30px;padding:12px 28px;font-weight:700}
.post{background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin-bottom:12px;overflow:hidden}
.post video{width:100%;max-height:340px;background:#000;display:block}
.post .h{display:flex;gap:8px;align-items:center;padding:8px 10px}
.ad{background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;padding:16px;border-radius:14px;margin-bottom:12px}
.ad small{opacity:.8}
h3{margin:14px 0 8px;font-size:15px}
.code{font:700 22px/1 ui-monospace,Menlo,monospace;letter-spacing:2px;color:var(--pr)}
.hide{display:none!important}
.sk{position:relative;min-height:160px;background:linear-gradient(100deg,var(--th) 30%,var(--sf) 50%,var(--th) 70%);background-size:200% 100%;animation:shm 1.2s infinite linear;border-radius:10px;overflow:hidden}
.sk::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border:3px solid var(--pr);border-top-color:transparent;border-radius:50%;animation:spn .8s linear infinite}
.sk video,.sk img{opacity:0}.vw video,.vw img{transition:opacity .5s}
.m .vw.sk{width:220px}
@keyframes shm{to{background-position:-200% 0}}@keyframes spn{to{transform:rotate(360deg)}}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.post{animation:fin .4s ease both}
.mm{float:right;margin-left:8px;opacity:.6;cursor:pointer;padding:0 4px}
.sheet{position:absolute;inset:0;background:#0007;z-index:40;display:flex;align-items:flex-end}
.sc{width:100%;background:var(--sf);border-radius:16px 16px 0 0;padding:8px 10px}
.sc button{display:block;width:100%;padding:14px;border:0;border-top:1px solid var(--ln);background:none;color:var(--tx);font-size:16px}
.sc button:first-child{border:0}
.bdg{background:#e5484d;color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;font-weight:700;margin-left:4px}
.prof{text-align:center;padding:10px 0}.prof .av{width:96px;height:96px;margin:0 auto 8px;font-size:34px}

#app{background:#1d4fe0}
header{background:linear-gradient(160deg,#1a47d4,#2d63f0);padding:14px 16px 32px;font-size:20px}
header.br{align-items:flex-start}
.bl{display:flex;gap:10px;align-items:center}
.bn{font:italic 800 28px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:-.5px}.bn span{color:#ffd23f}
.bt{font:500 12px/1.2 system-ui,sans-serif;opacity:.92;margin-top:4px}
.ha{display:flex;gap:2px}.hb{background:none;border:0;color:#fff;font-size:24px;padding:6px;display:flex;align-items:center}
main{margin-top:-20px;border-radius:26px 26px 0 0;background:var(--sf);padding:14px 14px 96px;position:relative}
.seg{background:none;padding:0;gap:8px;margin-bottom:8px}
.seg button{border-radius:22px;background:var(--th);color:var(--pr);padding:10px 6px;font-weight:600}
.seg button.on{background:var(--pr);color:#fff}
.row{background:none;border:0;border-bottom:1px solid var(--ln);border-radius:0;padding:11px 2px;gap:12px;margin:0}
.row .av{width:54px;height:54px;font-size:20px}.row b{font-size:16px}.row .s{font-size:14px}
.s.un{color:var(--tx);font-weight:600}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}.rt small{color:var(--mu);font-size:12px}.rt small.ac{color:var(--pr)}
.bd{background:var(--pr);color:#fff;border-radius:12px;min-width:22px;height:22px;padding:0 6px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.fab{position:absolute;right:18px;bottom:82px;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(160deg,#2d63f0,#1a47d4);color:#fff;box-shadow:0 6px 16px #1d4fe077;z-index:4;display:flex;align-items:center;justify-content:center}
nav .ic{position:relative;display:flex}nav .bdg{position:absolute;top:-7px;right:-12px;margin:0;font-size:11px;padding:0 5px}
#chat{background:var(--bg2)}
header.ch{padding:10px 12px;gap:10px;justify-content:flex-start;font-size:16px}
.cn{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch small{font:12px system-ui,sans-serif;opacity:.88}
.msgs{background-color:var(--bg2);background-image:radial-gradient(#00000012 1px,transparent 1px);background-size:18px 18px}
.m{border:0;box-shadow:0 1px 1px #0002;border-radius:14px;padding:7px 11px 4px}
.m.me{background:var(--bubme);color:var(--bubmt)}
.mt{font-size:11px;opacity:.65;text-align:right;margin-top:2px}.ck{color:#2d63f0;font-weight:700}
.bar{background:transparent;border:0;padding:8px;gap:8px}
.inp{flex:1;display:flex;align-items:center;background:var(--sf);border-radius:26px;padding:2px 6px;box-shadow:0 1px 3px #0003}
.inp input{border:0!important;background:none!important;flex:1;padding:10px 6px!important;outline:none}
.eb{border:0;background:none;font-size:20px;padding:6px}
.snd{width:46px;height:46px;border-radius:50%;border:0;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.dl{white-space:nowrap;display:block;font-size:12px;color:var(--pr);margin-top:4px;text-decoration:none;font-weight:600}.m.me .dl{color:var(--bubmt)}
.cbar{display:flex;gap:14px;justify-content:center;align-items:center;padding:6px 0 10px}
.cb{width:56px;height:56px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
.cb.off{background:#fff;color:#06143a}.cb.red{background:#e5484d;width:66px;height:66px}.cb.red svg{transform:rotate(135deg)}
.rec{color:#e5484d;font-weight:700}
</style>
</head>
<body>
<div id="app">
<header><span id="ttl">Unganisha</span><span id="hact"></span></header>
<main id="main"></main>
<nav id="nav"></nav>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
const $=(s,e=document)=>e.querySelector(s);
const ic={c:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>',g:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M15 14.5a5 5 0 0 1 6.5 4.5"/></svg>',v:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>',a:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>'};
const tabs=[['c','Nyumbani'],['g','Vikundi'],['v','Video'],['a','Profile']];
const PH='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.400 11.400 0 0 0 3.600.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.500a1 1 0 0 1 1 1c0 1.250.2 2.450.57 3.570a1 1 0 0 1-.25 1z"/></svg>';
const VC='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M15 8a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-2.500l5 3.500V7l-5 3.500z"/></svg>';
const MIC='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.900V21h2v-3.100A7 7 0 0 0 19 11z"/></svg>';
const SEND='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>';
const FAB='<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3v-3H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM19 3v6M16 6h6"/></svg>';
const LOGO='<svg width="46" height="46" viewBox="0 0 48 48"><path fill="#fff" d="M24 4C12 4 4 12 4 22c0 5 2.300 9.300 6 12.300L8 44l9-4c2.200.600 4.500 1 7 1 12 0 20-8 20-19S36 4 24 4z"/><circle cx="16" cy="22" r="3" fill="#1d4fe0"/><circle cx="24" cy="22" r="3" fill="#1d4fe0"/><circle cx="32" cy="22" r="3" fill="#1d4fe0"/></svg>';
const rc=()=>'CG'+Math.floor(10+Math.random()*90)+String.fromCharCode(65+Math.random()*26|0);
const S={tab:0,sub:'chat',
me:{name:'Mimi',code:rc(),useCode:true,media:null,type:null},
contacts:[],
chats:{},groups:[],
posts:[]};
const ini=n=>(n||'?')[0].toUpperCase();
const idLabel=()=>S.me.useCode?S.me.code:S.me.name;
const COL=['#1d4fe0','#0f9d58','#e8710a','#9334e6','#d93025','#00897b','#c2185b'];const colr=n=>COL[[...String(n||'?')].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const avatar=(n,u)=>{const p=u&&(S.prof||{})[u],on=u?` onclick="viewProf('${u}',event)"`:'';return p&&p.pic?`<div class="av"${on}><img src="${p.pic}" alt=""></div>`:`<div class="av" style="background:${colr(n)}"${on}>${ini(n)}</div>`};
const myAv=()=>`<div class="av" onclick="viewProf(uid)">${S.me.media?(S.me.type==='video'?`<video src="${S.me.media}" autoplay loop muted playsinline></video>`:`<img src="${S.me.media}" alt="">`):ini(S.me.name)}</div>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function nav(){$('#nav').innerHTML=tabs.map((t,i)=>`<button class="${i===S.tab?'on':''}" onclick="S.tab=${i};render()"><span class="ic">${ic[t[0]]}${i===0&&tot()?`<b class="bdg">${tot()}</b>`:''}</span><span>${t[1]}</span></button>`).join('')}
function hdr(){const h=$('header');
 if(S.tab===0){h.className='br';h.innerHTML=`<div class="bl">${LOGO}<div><div class="bn">Swift<span>Chat</span></div><div class="bt">Tuma. Pokea. Shirikiana.</div></div></div><div class="ha"><button class="hb" onclick="srch()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button><button class="hb" onclick="menu()">&#8942;</button></div><span id="hact" style="display:none"></span>`}
 else{h.className='';h.innerHTML=`<span id="ttl">${tabs[S.tab][1]}</span><span id="hact"></span>`}}
function render(){cacheSave();nav();hdr();[pChat,pCom,pVid,pAcc][S.tab]();if(ready)listenProfs();$('.fab')?.remove();
 if(S.tab===0){const f=document.createElement('button');f.className='fab';f.innerHTML=FAB;f.onclick=newChat;$('#app').appendChild(f)}}
function sheet(h){const o=document.createElement('div');o.className='sheet';o.onclick=e=>{if(e.target===o)o.remove()};o.innerHTML='<div class="sc" style="max-height:70%;overflow:auto">'+h+'</div>';$('#app').appendChild(o)}
const cl="this.closest('.sheet').remove();";
function newChat(){sheet(S.contacts.map((c,i)=>`<button onclick="${cl}openChat(${i})">${esc(c.name)}</button>`).join('')+`<button onclick="${cl}S.tab=3;render()">+ Ongeza mtu mpya</button>`)}
function menu(){sheet(`<button onclick="${cl}S.tab=3;render()">+ Ongeza mtu mpya</button><button onclick="${cl}setLang('${LANG==='en'?'sw':'en'}')">${LANG==='en'?'Kiswahili':'English'}</button><button onclick="${cl}">Ghairi</button>`)}
function srch(){S.sq=!S.sq;pChat();if(S.sq)setTimeout(()=>{const q=$('#sq');q&&q.focus()},50)}
function fq(v){v=v.toLowerCase();document.querySelectorAll('#main .row[data-n]').forEach(r=>r.classList.toggle('hide',!r.dataset.n.includes(v)))}
const hm=ts=>ts?new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
function fmt(ts){if(!ts)return '';const d=new Date(ts),n=new Date();if(d.toDateString()===n.toDateString())return hm(ts);if(d.toDateString()===new Date(n-864e5).toDateString())return 'Jana';return d.toLocaleDateString([],{day:'numeric',month:'short'})}

/* ---- Page 1 ---- */
function pChat(){
 $('#hact').innerHTML='';S.lt=S.lt||{};S.il=S.il||{};
 const pill=(k,l)=>`<button class="${S.sub===k?'on':''}" onclick="S.sub='${k}';render()">${l}</button>`;
 let list=S.contacts.map((c,i)=>[c,i]).sort((a,b)=>(S.lt[b[0].uid]||0)-(S.lt[a[0].uid]||0));
 if(S.sub==='unread')list=list.filter(x=>x[0].uid&&unr(x[0].uid));
 let h=`<div class="seg">${pill('chat','Chats')}${pill('unread','Hazijasomwa')}${pill('call','Simu')}</div>`;
 if(S.sq)h+='<input type="text" id="sq" placeholder="Tafuta" oninput="fq(this.value)" style="margin-bottom:8px">';
 if(!S.contacts.length)h+='<p class="s" style="color:var(--mu)">Hakuna mawasiliano. Ongeza watu kwenye Akaunti.</p>';
 else if(S.sub==='unread'&&!list.length)h+='<p class="s" style="color:var(--mu)">Hakuna ujumbe ambao haujasomwa.</p>';
 else h+=list.map(([c,i])=>{const last=(S.chats[c.code]||[]).slice(-1)[0],u=c.uid?unr(c.uid):0,pv=S.il[c.uid]||(last?(last.t||last.k):'Anza mazungumzo'),dn=esc(c.name.toLowerCase());
  return S.sub==='call'?`<div class="row" data-n="${dn}">${avatar(c.name,c.uid)}<div class="t"><b>${esc(c.name)}</b><div class="s">${esc(c.code)}</div></div><button class="ib" title="Sauti" onclick="startCall([${i}],false)">${PH}</button><button class="ib" title="Video" onclick="startCall([${i}],true)">${VC}</button></div>`
  :`<div class="row" data-n="${dn}" onclick="openChat(${i})">${avatar(c.name,c.uid)}<div class="t"><b>${esc(c.name)}</b><div class="s${u?' un':''}">${esc(pv)}</div></div><div class="rt"><small class="${u?'ac':''}">${fmt(S.lt[c.uid])}</small>${u?`<span class="bd">${u}</span>`:''}</div></div>`}).join('');
 const calls=S.calls||[];
 if(S.sub==='call'&&calls.length)h+='<h3>Simu za hivi karibuni</h3>'+calls.slice().reverse().map(x=>`<div class="row"><div class="t">${esc(x)}</div></div>`).join('');
 $('#main').innerHTML=h}
function cid(c){return [uid,c.uid].sort().join('_')}
function openChat(i){
 const c=S.contacts[i];if(!c.uid){alert('Mtu huyu hana akaunti ya Unganisha.');return}
 if(!uid){note('Inaunganisha...');setTimeout(()=>note(''),1200);return}
 S.cur=c.code;S.cc=c;markRead(c.uid);S.chats[c.code]=S.chats[c.code]||[];
 const o=document.createElement('div');o.className='ov';o.id='chat';
 o.innerHTML=`<header class="ch"><button class="hb" onclick="closeChat()">&#8592;</button><span onclick="viewProf('${c.uid}')">${avatar(c.name,c.uid)}</span><div style="flex:1;min-width:0"><div class="cn">${esc(c.name)}</div><small>${esc(c.code)}</small></div><button class="hb" onclick="startCall([${i}],false)">${PH}</button><button class="hb" onclick="startCall([${i}],true)">${VC}</button></header>
 <div class="msgs" id="msgs"></div><div class="menu hide" id="menu"><button class="btn o" onclick="pick('image/*','Picha')">Picha</button><button class="btn o" onclick="pick('video/*','Video')">Video</button><button class="btn o" onclick="pick('*/*','Hati')">Hati</button><button class="btn o" onclick="appMenu()">Apps</button></div>
 <div class="menu hide" id="emo">${'😀 😂 😍 👍 🙏 😢 😮 🎉 ❤️ 🔥 😎 🤝'.split(' ').map(e=>`<button class="ib" onclick="addEmo('${e}')">${e}</button>`).join('')}</div>
 <div class="bar"><div class="inp" id="inp"><button class="eb" onclick="tg('emo')">😊</button><input type="text" id="mi" placeholder="Andika ujumbe" oninput="vs()"><button class="eb" onclick="tg('menu')">&#128206;</button></div><div class="inp hide" id="rcb"><span class="rec" style="padding:0 8px">&#9679;</span><span id="rt" style="flex:1">0:00</span><button class="eb" onclick="stopRec(false)">&#128465;</button></div><button class="snd" onclick="sndClick()">${MIC}</button></div>`;
 $('#app').appendChild(o);paint();

async function media(v){try{return await navigator.mediaDevices.getUserMedia({audio:true,video:!!v})}catch(e){try{return await navigator.mediaDevices.getUserMedia({audio:true})}catch(e2){return null}}}
function startCall(ids,v){const u=ids.map(i=>S.contacts[i].uid);callUids(u,v,S.contacts[ids[0]].name)}
async function callUids(uids,video,name){
 uids=uids.filter(Boolean);if(CL)return;if(!uids.length){alert('Mtu huyu hana akaunti ya Unganisha.');return}
 const ref=FB.db.collection('calls').doc();
 await ref.set({from:uid,fromName:S.me.name,members:[uid].concat(uids),video:!!video,status:'ringing',ts:Date.now(),name:name||''});
 uids.forEach(u=>tellInbox(u,video?'[Simu ya video]':'[Simu ya sauti]'));
 notify({type:'call',callId:ref.id,fromName:S.me.name,video:!!video});
 (S.calls=S.calls||[]).push((video?'Video: ':'Sauti: ')+(name||nameOf(uids[0])));

function tile(p,label,stream,self){let t=$('#t_'+p);if(!t){t=document.createElement('div');t.className='tile';t.id='t_'+p;t.innerHTML=`<video autoplay playsinline ${self?'muted':''}></video><small></small>`;$('#cg').appendChild(t)}

async function joinCall(id,video,creator,name){
 CL={id,video,creator,peers:{},unsubs:[],names:{},local:await media(video)};
 const ref=FB.db.collection('calls').doc(id);
 const o=document.createElement('div');o.className='ov call';o.id='call';
 o.innerHTML=`<div>${esc(name||'Simu')} &middot; <span id="tm">0:00</span></div><div class="grid" id="cg"></div><div class="cbar"><button class="cb" title="Zima maikrofoni" onclick="cMute(this)">&#127908;</button>${video?'<button class="cb" title="Kamera" onclick="cCam(this)">&#128247;</button><button class="cb" title="Badili kamera" onclick="cFlip()">&#128260;</button>':''}<button class="cb red" title="Maliza" onclick="endCall()">${PH}</button></div>`;
 $('#app').appendChild(o);tile(uid,'Mimi',CL.local,true);
 let s=0;CL.tm=setInterval(()=>{s++;const t=$('#tm');if(t)t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},1000);
 const jt=Date.now();await ref.collection('joined').doc(uid).set({t:jt,name:S.me.name});
 if(creator){const miss=()=>{if(CL&&CL.id===id&&!CL.got){note('Hapatikani kwa sasa');setTimeout(()=>note(''),3500);endCall()}};
  CL.ringT=setTimeout(miss,60000);
  CL.unsubs.push(ref.onSnapshot(d=>{const x=d.data()||{},dc=(x.declined||[]).length;if(dc&&dc>=(x.members||[]).length-1)miss()}))}
 CL.unsubs.push(ref.collection('joined').onSnapshot(sn=>sn.docChanges().forEach(ch=>{
  const p=ch.doc.id;if(p===uid||!CL)return;const d=ch.doc.data();
  if(ch.type==='added'){CL.got=true;clearTimeout(CL.ringT);CL.names[p]=d.name;if(d.t>jt||(d.t===jt&&p>uid))connect(p)}
  if(ch.type==='removed')drop(p)})));
 CL.unsubs.push(ref.collection('signals').where('to','==',uid).onSnapshot(sn=>sn.docChanges().forEach(ch=>{if(ch.type==='added')onSig(ch.doc.data())})))}
function peer(p){if(CL.peers[p])return CL.peers[p];
 const pc=new RTCPeerConnection(ICE),o={pc,q:[]};CL.peers[p]=o;
 if(CL.local)CL.local.getTracks().forEach(t=>pc.addTrack(t,CL.local));
 else{pc.addTransceiver('audio',{direction:'recvonly'});if(CL.video)pc.addTransceiver('video',{direction:'recvonly'})}
 pc.onicecandidate=e=>{if(e.candidate)sig(p,'ice',e.candidate.toJSON())};
 pc.ontrack=e=>tile(p,CL.names[p]||nameOf(p),e.streams[0]);
 return o}
function sig(to,type,data){FB.db.collection('calls').doc(CL.id).collection('signals').add({from:uid,to,type,data:JSON.stringify(data),ts:Date.now()})}
async function connect(p){const o=peer(p);const d=await o.pc.createOffer();await o.pc.setLocalDescription(d);sig(p,'offer',d)}
function flush(o){o.q.forEach(c=>o.pc.addIceCandidate(c).catch(()=>{}));o.q=[]}
async function onSig(m){if(!CL)return;const o=peer(m.from),d=JSON.parse(m.data);
 if(m.type==='offer'){await o.pc.setRemoteDescription(d);flush(o);const a=await o.pc.createAnswer();await o.pc.setLocalDescription(a);sig(m.from,'answer',a)}
 else if(m.type==='answer'){await o.pc.setRemoteDescription(d);flush(o)}
 else{if(o.pc.remoteDescription)o.pc.addIceCandidate(d).catch(()=>{});else o.q.push(d)}}
function drop(p){const o=CL.peers[p];if(o){o.pc.close();delete CL.peers[p]}$('#t_'+p)?.remove();if(!Object.keys(CL.peers).length)endCall()}
async function endCall(){if(!CL)return;const c=CL;CL=null;clearInterval(c.tm);clearTimeout(c.ringT);c.unsubs.forEach(f=>f());
 Object.values(c.peers).forEach(o=>o.pc.close());if(c.local)c.local.getTracks().forEach(t=>t.stop());
 $('#call')?.remove();const ref=FB.db.collection('calls').doc(c.id);
 try{await ref.collection('joined').doc(uid).delete();if(c.creator)await ref.update({status:'ended'})}catch(e){}}

 if(f.size>100*1024*1024){alert('Faili ni kubwa mno (kikomo 100 MB).');return null}
 note('Inapakia 0%');
 try{
  const t=await FB.auth.currentUser.getIdToken();
  const H={'Content-Type':'application/json',Authorization:'Bearer '+t};

  const p=await pr.json();if(!pr.ok)throw new Error(p.error||('prepare '+pr.status));
  const hd=Object.assign({'Content-Type':p.mime_type||f.type||'application/octet-stream'},p.upload_headers||{});
  await new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('PUT',p.upload_url);Object.keys(hd).forEach(k=>x.setRequestHeader(k,hd[k]));x.upload.onprogress=e=>{if(e.lengthComputable)note('Inapakia '+Math.round(e.loaded/e.total*100)+'%')};x.onerror=()=>no(new Error('Mtandao umekatika'));x.onload=()=>x.status>=200&&x.status<300?ok():no(new Error('Upakiaji umeshindikana ('+x.status+')'));x.send(f)});
  note('Inahifadhi...');
  const cr=await fetch('/api/upload/complete',{method:'POST',headers:H,body:JSON.stringify({upload_id:p.upload_id})});
  const c=await cr.json();if(!cr.ok)throw new Error(c.error||('complete '+cr.status));
  note('Imepakiwa \u2713');setTimeout(()=>note(''),1500);return c.url;
 }catch(e){console.error(e);note('');alert('Faili imeshindwa kupakia: '+e.message);return null}}

function tr(s){if(LANG!=='en'||!s)return s;const k=String(s).trim();if(EN[k])return s.replace(k,EN[k]);for(const [r,v] of EP)if(r.test(k))return s.replace(k,k.replace(r,v));return s}

function tx(root){if(LANG!=='en')return;root=root||document.body;if(root.nodeType===3)return tn(root);ta(root);const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;while(n=w.nextNode()){n.nodeType===3?tn(n):ta(n)}}
